<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>soundcore Work · 离线状态视觉草图</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --card: #ffffff;
        --border: #e2e5eb;
        --ink: #12141a;
        --secondary: #5c6578;
        --muted: #8b93a7;
        --accent: #3b7cff;
        --accent-soft: #e8f0ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% 10%, #ffffff 0, transparent 28%),
          linear-gradient(145deg, #edf1f7 0%, #e6ebf2 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      button {
        font: inherit;
      }

      .review-layout {
        display: grid;
        grid-template-columns: minmax(360px, 430px) 300px;
        gap: 48px;
        align-items: center;
      }

      .phone {
        position: relative;
        width: min(430px, calc(100vw - 32px));
        height: min(900px, calc(100vh - 40px));
        min-height: 720px;
        overflow: hidden;
        border: 1px solid rgba(199, 205, 216, 0.9);
        border-radius: 38px;
        background: linear-gradient(180deg, #fafbfc 0%, #f0f2f5 100%);
        box-shadow:
          0 32px 80px rgba(39, 52, 76, 0.2),
          0 4px 12px rgba(39, 52, 76, 0.08),
          inset 0 1px 0 #ffffff;
      }

      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 48px;
        padding: 8px 25px 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #1a1d23;
        font-size: 12px;
      }

      .cellular {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
      }

      .cellular i {
        display: block;
        width: 3px;
        border-radius: 2px;
        background: currentColor;
      }

      .cellular i:nth-child(1) { height: 4px; }
      .cellular i:nth-child(2) { height: 7px; }
      .cellular i:nth-child(3) { height: 10px; }
      .cellular i:nth-child(4) { height: 12px; }

      .battery {
        position: relative;
        width: 23px;
        height: 11px;
        border: 1.5px solid currentColor;
        border-radius: 3px;
      }

      .battery::before {
        position: absolute;
        inset: 1.5px;
        width: 72%;
        border-radius: 1px;
        background: currentColor;
        content: "";
      }

      .battery::after {
        position: absolute;
        top: 3px;
        right: -3.5px;
        width: 2px;
        height: 4px;
        border-radius: 0 2px 2px 0;
        background: currentColor;
        content: "";
      }

      main {
        padding: 22px 20px 112px;
      }

      .device-card {
        padding: 20px 20px 22px;
        border: 1px solid rgba(226, 229, 235, 0.95);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow:
          0 14px 32px rgba(19, 28, 45, 0.075),
          0 2px 6px rgba(19, 28, 45, 0.035);
        text-align: center;
      }

      .product-stage {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 230px;
        margin: -10px 0 -3px;
        overflow: hidden;
        isolation: isolate;
      }

      .product-stage::after {
        position: absolute;
        z-index: -1;
        bottom: 27px;
        width: 134px;
        height: 18px;
        border-radius: 50%;
        background: rgba(86, 94, 108, 0.12);
        filter: blur(9px);
        content: "";
        transition: opacity 240ms ease, transform 240ms ease;
      }

      .product-image {
        width: 214px;
        height: 214px;
        object-fit: contain;
        filter: grayscale(0.9) saturate(0.18) contrast(0.84) brightness(1.03);
        opacity: 0.62;
        transform: scale(0.96) translateY(2px);
        transition:
          filter 240ms ease,
          opacity 240ms ease,
          transform 240ms ease;
      }

      .offline-signal {
        position: absolute;
        top: 27px;
        right: 43px;
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(224, 49, 49, 0.24);
        border-radius: 50%;
        background: rgba(255, 240, 240, 0.96);
        box-shadow:
          0 6px 16px rgba(224, 49, 49, 0.13),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        transition: opacity 180ms ease, transform 220ms ease;
      }

      .offline-symbol {
        display: block;
        width: 25px;
        height: 25px;
      }

      .device-card.is-image-original .offline-signal {
        opacity: 0;
      }

      .device-card.is-image-original .product-stage::after {
        opacity: 0.7;
        transform: scale(0.9);
      }

      .device-card.is-image-original .product-image {
        filter: none;
        opacity: 1;
        transform: none;
      }

      .device-title {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.18;
        letter-spacing: -0.45px;
      }

      .status-row {
        margin-top: 12px;
      }

      .bound-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 32px;
        padding: 5px 12px;
        border: 1px solid #9ebcff;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 14px;
        font-weight: 650;
      }

      .bound-chip::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .mac-address {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.2px;
      }

      .disconnect-copy {
        margin: 20px 0 0;
        color: var(--secondary);
        font-size: 14px;
        line-height: 1.55;
      }

      .connect-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        min-height: 58px;
        margin-top: 18px;
        border: 0;
        border-radius: 17px;
        background: linear-gradient(110deg, #3b7cff 0%, #3266ce 100%);
        box-shadow: 0 9px 20px rgba(59, 124, 255, 0.2);
        color: #fff;
        font-size: 17px;
        font-weight: 680;
        cursor: pointer;
      }

      .radar-icon {
        position: relative;
        width: 20px;
        height: 20px;
        border: 2px solid currentColor;
        border-radius: 50%;
      }

      .radar-icon::before {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 6px;
        height: 6px;
        border: 2px solid currentColor;
        border-radius: 50%;
        content: "";
      }

      .radar-icon::after {
        position: absolute;
        right: 0;
        bottom: -1px;
        width: 8px;
        height: 2px;
        border-radius: 2px;
        background: currentColor;
        content: "";
        transform: rotate(45deg);
        transform-origin: right center;
      }

      .nav-bar {
        position: absolute;
        right: 24px;
        bottom: 12px;
        left: 24px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        padding: 5px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 8px 24px rgba(25, 34, 50, 0.06);
        backdrop-filter: blur(18px);
      }

      .nav-item {
        display: grid;
        place-items: center;
        min-height: 57px;
        gap: 2px;
        border-radius: 14px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 550;
      }

      .nav-item.active {
        background: rgba(59, 124, 255, 0.12);
        color: var(--accent);
        font-weight: 700;
      }

      .nav-symbol {
        position: relative;
        display: block;
        width: 24px;
        height: 22px;
        color: currentColor;
      }

      .home-icon::before {
        position: absolute;
        left: 4px;
        bottom: 1px;
        width: 15px;
        height: 13px;
        border-radius: 2px 2px 3px 3px;
        background: currentColor;
        content: "";
      }

      .home-icon::after {
        position: absolute;
        top: 1px;
        left: 4px;
        width: 15px;
        height: 15px;
        border-radius: 2px;
        background: currentColor;
        content: "";
        transform: rotate(45deg) scale(0.72);
      }

      .device-icon::before,
      .device-icon::after {
        position: absolute;
        border: 2px solid currentColor;
        border-radius: 2px;
        content: "";
      }

      .device-icon::before {
        top: 2px;
        left: 1px;
        width: 14px;
        height: 16px;
      }

      .device-icon::after {
        right: 1px;
        bottom: 1px;
        width: 8px;
        height: 12px;
        background: #eef4ff;
      }

      .gear-icon {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        font-size: 23px;
        line-height: 1;
      }

      .review-panel {
        padding: 26px;
        border: 1px solid rgba(255, 255, 255, 0.76);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 20px 50px rgba(42, 54, 77, 0.11);
        backdrop-filter: blur(20px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .review-panel h2 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.55px;
      }

      .review-panel > p:not(.eyebrow) {
        margin: 12px 0 20px;
        color: var(--secondary);
        font-size: 14px;
        line-height: 1.6;
      }

      .segmented-control {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: #f2f4f7;
      }

      .segmented-control button {
        min-height: 38px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--secondary);
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }

      .segmented-control button.active {
        background: #fff;
        box-shadow: 0 2px 8px rgba(27, 36, 52, 0.09);
        color: var(--ink);
      }

      .review-points {
        display: grid;
        gap: 12px;
        margin: 22px 0 0;
        padding: 0;
        list-style: none;
      }

      .review-points li {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 9px;
        align-items: start;
        color: var(--secondary);
        font-size: 13px;
        line-height: 1.45;
      }

      .review-points b {
        color: var(--ink);
        font-weight: 650;
      }

      .point-number {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 750;
      }

      @media (max-width: 820px) {
        body {
          display: block;
          min-height: 100%;
          padding: 0;
          background: var(--bg);
        }

        .review-layout {
          display: block;
        }

        .phone {
          width: 100%;
          height: 100dvh;
          min-height: 700px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        .review-panel {
          position: fixed;
          z-index: 10;
          top: 54px;
          right: 16px;
          width: 184px;
          padding: 5px;
          border-radius: 14px;
          background: rgba(255, 255, 255, 0.88);
        }

        .review-panel > :not(.segmented-control) {
          display: none;
        }
      }

      @media (max-height: 790px) {
        main {
          padding-top: 8px;
        }

        .device-card {
          padding-top: 10px;
        }

        .product-stage {
          height: 196px;
        }

        .product-image {
          width: 186px;
          height: 186px;
        }

        .disconnect-copy {
          margin-top: 13px;
        }

        .connect-button {
          min-height: 52px;
          margin-top: 13px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="review-layout">
      <section class="phone" aria-label="soundcore Work 设备页离线状态草图">
        <div class="status-bar" aria-hidden="true">
          <span>16:05</span>
          <div class="status-icons">
            <span class="cellular"><i></i><i></i><i></i><i></i></span>
            <span>5G</span>
            <span class="battery"></span>
          </div>
        </div>

        <main>
          <article class="device-card" id="deviceCard">
            <div class="product-stage" aria-label="离线：设备蓝牙连接已断开">
              <img
                class="product-image"
                src="../assets/product/d3200_device_connected_white.webp"
                alt="soundcore Work 设备与充电盒"
              />
              <span class="offline-signal" aria-hidden="true">
                <img
                  class="offline-symbol"
                  src="assets/bluetooth_disabled_round_24.svg"
                  alt=""
                />
              </span>
            </div>

            <h2 class="device-title">soundcore Work</h2>

            <div class="status-row">
              <span class="bound-chip">已绑定</span>
            </div>

            <p class="mac-address">00:7F:1D:04:CC:A3</p>
            <p class="disconnect-copy">设备已断开。点下方按钮扫描并重新连接。</p>

            <button class="connect-button" type="button">
              <span class="radar-icon" aria-hidden="true"></span>
              <span>扫描并连接</span>
            </button>
          </article>
        </main>

        <nav class="nav-bar" aria-label="主导航">
          <div class="nav-item">
            <span class="nav-symbol home-icon" aria-hidden="true"></span>
            <span>首页</span>
          </div>
          <div class="nav-item active" aria-current="page">
            <span class="nav-symbol device-icon" aria-hidden="true"></span>
            <span>设备</span>
          </div>
          <div class="nav-item">
            <span class="gear-icon" aria-hidden="true">⚙</span>
            <span>设置</span>
          </div>
        </nav>
      </section>

      <aside class="review-panel">
        <p class="eyebrow">Visual direction</p>
        <h2>让图片表达离线</h2>
        <p>
          离线是设备当前的可用性，不再与“已绑定”争夺标签位置。切换下方选项可对比处理前后的产品图。
        </p>

        <div class="segmented-control" aria-label="产品图效果对比">
          <button class="active" type="button" data-mode="offline">离线效果</button>
          <button type="button" data-mode="original">查看原图</button>
        </div>

        <ol class="review-points">
          <li>
            <span class="point-number">1</span>
            <span><b>降饱和与对比</b><br />让设备自然进入不可用状态。</span>
          </li>
          <li>
            <span class="point-number">2</span>
            <span><b>蓝牙已断开</b><br />标准斜杠图标直接说明设备连接状态。</span>
          </li>
          <li>
            <span class="point-number">3</span>
            <span><b>只保留已绑定</b><br />状态层级更清楚，减少标签堆叠。</span>
          </li>
        </ol>
      </aside>
    </div>

    <script>
      const card = document.querySelector("#deviceCard");
      const modeButtons = document.querySelectorAll("[data-mode]");

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const showOriginal = button.dataset.mode === "original";
          card.classList.toggle("is-image-original", showOriginal);
          modeButtons.forEach((item) => {
            item.classList.toggle("active", item === button);
            item.setAttribute("aria-pressed", String(item === button));
          });
        });
      });
    </script>
  </body>
</html>
